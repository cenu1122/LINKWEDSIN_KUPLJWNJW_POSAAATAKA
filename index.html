<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LinkedIn → Google Sheets</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0 15px;
      box-sizing: border-box;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>LinkedIn → Google Sheets</h1>

  <label>Ključna riječ</label>
  <input id="keyword" placeholder="npr. AI, marketing, posao">

  <label>Autor</label>
  <input id="autor">

  <label>Firma</label>
  <input id="firma">

  <label>Tekst objave</label>
  <textarea id="tekst" rows="6"></textarea>

  <label>Link</label>
  <input id="link">

  <label>Lajkovi</label>
  <input id="lajkovi" type="number" value="0">

  <label>Komentari</label>
  <input id="komentari" type="number" value="0">

  <button onclick="sacuvaj()">SPREMI U GOOGLE SHEETS</button>

  <div id="status"></div>

<script>

function sacuvaj() {

  const objava = {
    autor: document.getElementById("autor").value,
    firma: document.getElementById("firma").value,
    tekst: document.getElementById("tekst").value,
    link: document.getElementById("link").value,
    lajkovi: document.getElementById("lajkovi").value,
    komentari: document.getElementById("komentari").value
  };

  document.getElementById("status").innerText =
    "Spremanje...";

  google.script.run
    .withSuccessHandler(function(rezultat) {

      document.getElementById("status").innerText =
        rezultat;

    })
    .withFailureHandler(function(greska) {

      document.getElementById("status").innerText =
        "Greška: " + greska.message;

    })
    .sacuvajObjavu(objava);
}

</script>

</body>
</html>
